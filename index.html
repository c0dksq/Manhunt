<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MANHUNT 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap');
:root {
  --black:#0a0a0a; --white:#f0ece4; --yellow:#e8d44d; --red:#d63030;
  --green:#4a9a4a; --grey:#1a1a1a; --grey2:#252525; --grey3:#333;
  --muted:rgba(240,236,228,0.3);
  --fh:'Bebas Neue',sans-serif; --fm:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--black);color:var(--white);font-family:var(--fm);min-height:100vh;overflow-x:hidden;}
.screen{display:none;min-height:100vh;flex-direction:column;position:relative;z-index:1;}
.screen.active{display:flex;}
#home{align-items:center;justify-content:center;padding:40px 20px;text-align:center;}
.logo{font-family:var(--fh);font-size:clamp(80px,18vw,150px);line-height:0.82;letter-spacing:3px;margin-bottom:6px;}
.logo-year{font-family:var(--fh);font-size:clamp(36px,8vw,64px);color:var(--yellow);letter-spacing:8px;margin-bottom:44px;}
.home-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;}
.sync-row{display:flex;align-items:center;gap:8px;margin-top:20px;font-size:10px;letter-spacing:2px;color:var(--muted);}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--grey3);flex-shrink:0;transition:background .3s;}
.sdot.ok{background:var(--green);}
.sdot.err{background:var(--red);}
.sdot.spin{background:var(--yellow);animation:blink 0.8s infinite;}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
.iow-tag{margin-top:14px;font-size:9px;letter-spacing:3px;color:var(--muted);}
.btn{display:block;width:100%;padding:15px 20px;font-family:var(--fm);font-size:12px;letter-spacing:2px;text-transform:uppercase;border:none;cursor:pointer;transition:all .15s;text-align:center;}
.btn-p{background:var(--yellow);color:var(--black);font-weight:500;}
.btn-p:hover{background:#f0dc5a;}
.btn-s{background:transparent;color:var(--white);border:1px solid var(--grey3);}
.btn-s:hover{border-color:var(--white);}
.btn-d{background:var(--red);color:var(--white);}
.btn-g{background:var(--green);color:var(--white);}
.btn-sm{padding:7px 12px;font-size:10px;width:auto;display:inline-block;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.tb{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--grey2);background:var(--black);position:sticky;top:0;z-index:50;}
.tb-title{font-family:var(--fh);font-size:22px;letter-spacing:2px;color:var(--yellow);}
.tb-back{font-size:10px;letter-spacing:1px;color:var(--muted);cursor:pointer;background:none;border:none;font-family:var(--fm);}
.tb-back:hover{color:var(--white);}
.tb-timer{font-family:var(--fh);font-size:13px;letter-spacing:2px;color:var(--muted);}
.tb-timer.urg{color:var(--red);}
.inner{padding:16px;flex:1;}
.lbl{font-size:9px;letter-spacing:3px;color:var(--muted);margin-bottom:12px;margin-top:20px;}
.lbl:first-child{margin-top:0;}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.tcard{background:var(--grey);border:1px solid var(--grey2);padding:14px;cursor:pointer;transition:border-color .15s;position:relative;}
.tcard:hover{border-color:var(--yellow);}
.tcard.tagged{border-color:var(--red);}
.tcard.tagged::after{content:'TAGGED';position:absolute;top:7px;right:8px;font-size:8px;letter-spacing:1px;color:var(--red);}
.tcard-name{font-family:var(--fh);font-size:19px;letter-spacing:1px;margin-bottom:3px;}
.tcard-pts{font-size:10px;color:var(--muted);}
.sbar{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:16px;}
.sbar.free{background:rgba(74,154,74,.12);border:1px solid rgba(74,154,74,.35);}
.sbar.tagged{background:rgba(214,48,48,.12);border:1px solid rgba(214,48,48,.35);}
.sdot2{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sdot2.free{background:var(--green);}
.sdot2.tagged{background:var(--red);}
.sbar-txt{font-size:11px;letter-spacing:1px;flex:1;}
.sbar-pts{font-family:var(--fh);font-size:22px;color:var(--yellow);}
.task-card{background:var(--grey);border:1px solid var(--grey2);padding:14px;margin-bottom:8px;}
.task-top{display:flex;gap:10px;align-items:flex-start;}
.task-badge{background:var(--yellow);color:var(--black);font-size:11px;font-weight:500;padding:2px 7px;flex-shrink:0;margin-top:1px;white-space:nowrap;}
.task-badge.rep{background:var(--grey3);color:var(--white);}
.task-meta{flex:1;}
.task-title{font-size:13px;margin-bottom:3px;}
.task-desc{font-size:10px;color:var(--muted);line-height:1.4;}
.task-rep-label{font-size:9px;color:var(--yellow);letter-spacing:1px;margin-top:3px;}
.task-done-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
.done-chip{font-size:9px;letter-spacing:1px;color:var(--green);border:1px solid rgba(74,154,74,.4);padding:2px 8px;}
.count-chip{font-size:9px;letter-spacing:1px;color:var(--yellow);border:1px solid rgba(232,212,77,.4);padding:2px 8px;}
.upload-wrap{margin-top:10px;}
.upload-btn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--grey3);padding:12px;cursor:pointer;transition:border-color .15s;font-size:11px;letter-spacing:1px;color:var(--muted);}
.upload-btn:hover{border-color:var(--yellow);color:var(--white);}
.upload-btn input{display:none;}
.upload-progress{height:2px;background:var(--grey3);margin-top:6px;position:relative;overflow:hidden;display:none;}
.upload-progress::after{content:'';position:absolute;inset:0;background:var(--yellow);animation:prog 1.2s ease-in-out infinite;}
@keyframes prog{0%{transform:translateX(-100%)}100%{transform:translateX(100%)};}
.upload-progress.show{display:block;}
.lb-head{text-align:center;padding:20px 0 24px;}
.lb-title{font-family:var(--fh);font-size:44px;letter-spacing:3px;}
.lb-sub{font-size:9px;letter-spacing:3px;color:var(--muted);margin-top:3px;}
.lb-blackout{background:var(--grey);border:1px solid var(--grey2);padding:44px 20px;text-align:center;}
.lb-lock-icon{font-size:44px;margin-bottom:14px;}
.lb-lock-title{font-family:var(--fh);font-size:34px;letter-spacing:2px;color:var(--red);margin-bottom:8px;}
.lb-lock-sub{font-size:10px;color:var(--muted);letter-spacing:1px;line-height:1.7;}
.lb-list{display:flex;flex-direction:column;gap:6px;}
.lb-row{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--grey);border:1px solid var(--grey2);}
.lb-row.p1{border-color:var(--yellow);background:rgba(232,212,77,.07);}
.lb-row.p2{border-color:var(--grey3);}
.lb-row.p3{border-color:rgba(180,120,60,.35);}
.lb-pos{font-family:var(--fh);font-size:26px;color:var(--muted);width:28px;flex-shrink:0;}
.lb-row.p1 .lb-pos{color:var(--yellow);}
.lb-info{flex:1;}
.lb-name{font-family:var(--fh);font-size:19px;letter-spacing:1px;}
.lb-tasks{font-size:9px;color:var(--muted);margin-top:2px;}
.lb-score{font-family:var(--fh);font-size:30px;}
.lb-row.p1 .lb-score{color:var(--yellow);}
.tagged-pill{font-size:8px;letter-spacing:1px;color:var(--red);border:1px solid var(--red);padding:2px 5px;}
.rule-card{background:var(--grey);border:1px solid var(--grey2);padding:14px;margin-bottom:8px;font-size:12px;line-height:1.5;}
.rev-ov{position:fixed;inset:0;z-index:200;background:var(--black);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.rev-ov.on{display:flex;}
.rev-num{font-family:var(--fh);font-size:120px;color:var(--yellow);line-height:1;}
.rev-lbl{font-size:11px;letter-spacing:4px;color:var(--muted);}
.notif{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--yellow);color:var(--black);font-size:11px;letter-spacing:1px;padding:11px 22px;z-index:300;opacity:0;transition:opacity .25s;white-space:nowrap;font-family:var(--fm);pointer-events:none;}
.notif.on{opacity:1;}
.loader{position:fixed;inset:0;background:var(--black);z-index:500;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;transition:opacity .4s;}
.loader.hide{opacity:0;pointer-events:none;}
.loader-t{font-family:var(--fh);font-size:52px;letter-spacing:4px;color:var(--yellow);}
.loader-s{font-size:9px;letter-spacing:3px;color:var(--muted);}
.loader-bar{width:140px;height:2px;background:var(--grey2);overflow:hidden;}
.loader-bar::after{content:'';display:block;height:100%;background:var(--yellow);animation:prog 1.2s ease-in-out infinite;}
.empty{text-align:center;padding:36px 20px;color:var(--muted);font-size:10px;letter-spacing:1px;}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="loader-t">MANHUNT</div>
  <div class="loader-s">SYNCING...</div>
  <div class="loader-bar"></div>
</div>

<div class="screen active" id="home">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center">
    <div class="logo">MAN<br>HUNT</div>
    <div class="logo-year">2026</div>
    <div class="home-btns">
      <button class="btn btn-p" onclick="go('player-select')">I'M A PLAYER</button>
      <button class="btn btn-s" onclick="go('leaderboard')">LEADERBOARD</button>
      <button class="btn btn-s" onclick="go('rules-view')">RULES</button>
    </div>
    <div class="sync-row">
      <div class="sdot" id="sdot"></div>
      <span id="slbl">CONNECTING...</span>
    </div>
    <div class="iow-tag">ISLE OF WIGHT — MAY 2026</div>
  </div>
</div>

<div class="screen" id="rules-view">
  <div class="tb">
    <button class="tb-back" onclick="go('home')">← BACK</button>
    <div class="tb-title">RULES</div>
    <div style="width:50px"></div>
  </div>
  <div class="inner" id="rv-list"></div>
</div>

<div class="screen" id="player-select">
  <div class="tb">
    <button class="tb-back" onclick="go('home')">← BACK</button>
    <div class="tb-title">MANHUNT</div>
    <div style="width:50px"></div>
  </div>
  <div class="inner">
    <div class="lbl">SELECT YOUR TEAM</div>
    <div class="tgrid" id="tgrid"></div>
  </div>
</div>

<div class="screen" id="player-view">
  <div class="tb">
    <button class="tb-back" onclick="go('player-select')">← TEAMS</button>
    <div class="tb-title" id="pv-title">TEAM</div>
    <div class="tb-timer" id="pv-timer">--:--</div>
  </div>
  <div class="inner">
    <div id="pv-sbar" class="sbar free">
      <div class="sdot2 free" id="pv-sdot"></div>
      <div class="sbar-txt" id="pv-stxt">FREE TO SCORE</div>
      <div class="sbar-pts" id="pv-pts">0 PTS</div>
    </div>
    <div class="lbl">TASKS</div>
    <div id="pv-tasks"></div>
  </div>
</div>

<div class="screen" id="leaderboard">
  <div class="tb">
    <button class="tb-back" onclick="go('home')">← BACK</button>
    <div class="tb-title">STANDINGS</div>
    <div class="tb-timer" id="lb-timer">--:--</div>
  </div>
  <div class="inner">
    <div class="lb-head">
      <div class="lb-title">LEADERBOARD</div>
      <div class="lb-sub" id="lb-sub">ISLE OF WIGHT — 2026</div>
    </div>
    <div id="lb-content"></div>
  </div>
</div>

<div class="rev-ov" id="rev-ov">
  <div class="rev-lbl">REVEALING IN</div>
  <div class="rev-num" id="rev-num">3</div>
  <div class="rev-lbl" id="rev-sub">GET READY</div>
</div>

<div class="notif" id="notif"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ── CONFIG ──
const SUPABASE_URL = 'https://gmfdcenfbphxphlhqpmc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtZmRjZW5mYnBoeHBobGhxcG1jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNzgxMzYsImV4cCI6MjA5NDc1NDEzNn0.I9TDDsKvyuY_zcG4KHItlfQ0afIpPgdzM1XKH9SCbH8';
const SUPABASE_BUCKET = 'proofs';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let teams = [];
let tasks = [];
let rules = [];
let settings = {};
let curTeam = null;
let curScreen = 'home';

// ── SUPABASE FETCH ──
async function pull() {
  try {
    const [teamsRes, tasksRes, rulesRes, settingsRes] = await Promise.all([
      sb.from('teams').select('*').order('id'),
      sb.from('tasks').select('*').order('id'),
      sb.from('rules').select('*').order('position'),
      sb.from('settings').select('*').eq('id', 1).single()
    ]);
    if(teamsRes.error) throw teamsRes.error;
    teams = teamsRes.data || [];
    tasks = tasksRes.data || [];
    rules = (rulesRes.data || []).map(r => r.rule);
    settings = settingsRes.data || {};
    setSS('ok', 'SYNCED');
    return true;
  } catch(e) {
    console.error('Pull error:', e);
    setSS('err', 'SYNC ERROR');
    return false;
  }
}

// ── REALTIME ──
function startRealtime() {
  sb.channel('game-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'teams' }, async () => {
      const { data } = await sb.from('teams').select('*').order('id');
      teams = data || [];
      refresh();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, async () => {
      const { data } = await sb.from('settings').select('*').eq('id', 1).single();
      settings = data || {};
      refresh();
      if(settings.revealed) triggerRevealUI();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, async () => {
      const { data } = await sb.from('tasks').select('*').order('id');
      tasks = data || [];
      refresh();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rules' }, async () => {
      const { data } = await sb.from('rules').select('*').order('position');
      rules = (data || []).map(r => r.rule);
      refresh();
    })
    .subscribe();
}

function setSS(type, lbl) {
  const d = document.getElementById('sdot');
  const l = document.getElementById('slbl');
  if(d) d.className = 'sdot ' + type;
  if(l) l.textContent = lbl;
}

// ── INIT ──
async function init() {
  try { await pull(); } catch(e) { setSS('err', 'SYNC ERROR'); }
  document.getElementById('loader').classList.add('hide');
  setTimeout(() => { const l = document.getElementById('loader'); if(l) l.remove(); }, 500);
  startTimer();
  startRealtime();
}

// ── SCREEN ──
function go(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  curScreen = id; refresh();
}

function refresh() {
  if(curScreen === 'player-select') renderTeams();
  if(curScreen === 'player-view') renderPV();
  if(curScreen === 'leaderboard') renderLB();
  if(curScreen === 'rules-view') renderRulesView();
}

// ── TIMER ──
function timeLeft() {
  if(!settings.end_time) return { total:0, h:0, m:0, s:0, ended:true };
  const now = new Date();
  const [eh, em] = settings.end_time.split(':').map(Number);
  const end = new Date(); end.setHours(eh, em, 0, 0);
  const diff = end - now;
  if(diff <= 0) return { total:0, h:0, m:0, s:0, ended:true };
  return { total:diff, h:Math.floor(diff/3600000), m:Math.floor((diff%3600000)/60000), s:Math.floor((diff%60000)/1000), ended:false };
}

function isBlackout() {
  if(settings.revealed) return false;
  const t = timeLeft();
  return settings.live && (t.ended || t.total <= (settings.bo_hrs || 2) * 3600000);
}

function fmtTimer() {
  const t = timeLeft();
  if(!settings.live) return 'NOT STARTED';
  if(t.ended) return 'ENDED';
  return `${String(t.h).padStart(2,'0')}:${String(t.m).padStart(2,'0')}:${String(t.s).padStart(2,'0')}`;
}

function startTimer() {
  setInterval(() => {
    const t = fmtTimer();
    const tl = timeLeft();
    const urg = tl.total < 3600000 && settings.live && !tl.ended;
    ['pv-timer','lb-timer'].forEach(id => {
      const el = document.getElementById(id);
      if(el) { el.textContent = t; el.className = 'tb-timer' + (urg ? ' urg' : ''); }
    });
    if(curScreen === 'leaderboard') renderLB();
    checkForNewTasks();
  }, 1000);
}

// ── HELPERS ──
function tasksDone(team) {
  return tasks.filter(task => {
    const req = task.req || 1;
    const cnt = (team.task_counts || {})[task.id] || 0;
    return cnt >= req;
  }).length;
}

function totalSubmissions(team) {
  return Object.values(team.task_counts || {}).reduce((a, b) => a + b, 0);
}

// ── TEAMS ──
function renderTeams() {
  const g = document.getElementById('tgrid');
  if(!g) return;
  g.innerHTML = teams.map(t => `
    <div class="tcard ${t.tagged ? 'tagged' : ''}" onclick="selTeam(${t.id})">
      <div class="tcard-name">${t.name}</div>
      <div class="tcard-pts">${isBlackout() ? '?? PTS' : t.pts + ' PTS'} · ${tasksDone(t)} tasks</div>
    </div>`).join('');
}

function selTeam(id) {
  const team = teams.find(t => t.id === id);
  if(!team) return;
  if(team.pass && team.pass.trim() !== '') {
    const attempt = prompt(`Enter Password for ${team.name}:`);
    if(attempt === null || attempt.trim() !== team.pass) {
      alert('Incorrect Password or Cancelled');
      return;
    }
  }
  curTeam = id;
  go('player-view');
}

// ── PLAYER VIEW ──
function renderPV() {
  if(curTeam === null) return;
  const team = teams.find(t => t.id === curTeam);
  if(!team) return;
  document.getElementById('pv-title').textContent = team.name;

  const bar = document.getElementById('pv-sbar');
  const dot = document.getElementById('pv-sdot');
  const txt = document.getElementById('pv-stxt');
  document.getElementById('pv-pts').textContent = isBlackout() ? '?? PTS' : team.pts + ' PTS';

  if(team.tagged) {
    bar.className = 'sbar tagged'; dot.className = 'sdot2 tagged';
    txt.textContent = 'YOU ARE TAGGED — GO HUNT!';
  } else {
    bar.className = 'sbar free'; dot.className = 'sdot2 free';
    txt.textContent = settings.live ? 'FREE TO SCORE' : 'WAITING FOR KICK OFF';
  }

  const tc = document.getElementById('pv-tasks');
  const visibleTasks = tasks.filter(isTaskUnlocked);
  const lockedCount = tasks.length - visibleTasks.length;

  tc.innerHTML = (lockedCount > 0 ? `
    <div style="background:var(--grey);border:1px solid var(--grey2);padding:14px;margin-bottom:8px;text-align:center;">
      <div style="font-size:10px;color:var(--muted);letter-spacing:2px">🔒 ${lockedCount} TASK${lockedCount > 1 ? 'S' : ''} LOCKED — MORE DROP EACH HOUR</div>
    </div>` : '') +
  visibleTasks.map(task => {
    const cnt = (team.task_counts || {})[task.id] || 0;
    const req = task.req || 1;
    const done = !task.rep && cnt >= req;
    const canUpload = settings.live && !team.tagged && !done;

    let chipHtml = '';
    if(cnt > 0) {
      if(task.rep) {
        const completions = Math.floor(cnt / req);
        chipHtml = `<div class="count-chip">COMPLETED ${completions}× (${cnt} PROOFS) — ${isBlackout() ? '??' : completions * task.pts} PTS</div>`;
      } else {
        if(cnt >= req) chipHtml = `<div class="done-chip">✓ DONE</div>`;
        else chipHtml = `<div class="count-chip">⏳ ${cnt}/${req} PROOFS UPLOADED</div>`;
      }
    }

    return `
      <div class="task-card">
        <div class="task-top">
          <div class="task-badge ${task.rep ? 'rep' : ''}">${task.pts} PTS${req > 1 ? ` (Req ${req})` : ''}</div>
          <div class="task-meta">
            <div class="task-title">${task.name}</div>
            <div class="task-desc">${task.desc}</div>
            ${task.rep ? `<div class="task-rep-label">↻ REPEATABLE — EARN EACH TIME</div>` : ''}
          </div>
        </div>
        ${chipHtml ? `<div class="task-done-row">${chipHtml}</div>` : ''}
        ${canUpload ? `
          <div class="upload-wrap">
            <label class="upload-btn" id="ulbl-${task.id}">
              <input type="file" accept="image/*,video/*" capture="environment"
                onchange="submitTask(${team.id},${task.id},this)">
              📎 ${task.rep && cnt >= req ? 'SUBMIT AGAIN' : 'UPLOAD PROOF'}
            </label>
            <div class="upload-progress" id="uprog-${task.id}"></div>
          </div>` : ''}
      </div>`;
  }).join('');
}

// ── TASK UNLOCK ──
function isTaskUnlocked(task) {
  if(!task.unlock_at) return true; // No schedule set, show all
  const now = new Date();
  const [uh, um] = task.unlock_at.split(':').map(Number);
  const unlockTime = new Date(); unlockTime.setHours(uh, um, 0, 0);
  return now >= unlockTime;
}

let lastUnlockedCount = -1;
function checkForNewTasks() {
  const unlockedNow = tasks.filter(isTaskUnlocked).length;
  if(lastUnlockedCount === -1) { lastUnlockedCount = unlockedNow; return; }
  if(unlockedNow > lastUnlockedCount) {
    const diff = unlockedNow - lastUnlockedCount;
    notify(`🔓 ${diff} NEW TASK${diff > 1 ? 'S' : ''} UNLOCKED!`);
    lastUnlockedCount = unlockedNow;
    if(curScreen === 'player-view') renderPV();
    if(curScreen === 'player-select') renderTeams();
  }
}
// ── RULES ──
function renderRulesView() {
  const el = document.getElementById('rv-list');
  if(!el) return;
  if(!rules.length) { el.innerHTML = `<div class="empty">NO RULES SET</div>`; return; }
  el.innerHTML = rules.map(r => `<div class="rule-card">${r}</div>`).join('');
}

// ── UPLOAD & SUBMIT ──
async function submitTask(teamId, taskId, input) {
  if(!input.files || !input.files[0]) return;
  const team = teams.find(t => t.id === teamId);
  const task = tasks.find(t => t.id === taskId);
  if(!task || !team) return;
  const req = task.req || 1;
  if(!task.rep && (team.task_counts || {})[taskId] >= req) return;

  const file = input.files[0];
  const prog = document.getElementById('uprog-' + taskId);
  const lbl = document.getElementById('ulbl-' + taskId);
  if(prog) prog.classList.add('show');
  if(lbl) lbl.style.opacity = '0.4';

  const fileExt = file.name.split('.').pop();
  const fileName = `team${teamId}_task${taskId}_${Date.now()}.${fileExt}`;

  try {
    const { error: uploadError } = await sb.storage.from(SUPABASE_BUCKET).upload(fileName, file, { contentType: file.type });
    if(uploadError) throw uploadError;

    const { data: urlData } = sb.storage.from(SUPABASE_BUCKET).getPublicUrl(fileName);
    const publicUrl = urlData.publicUrl;

    await doSubmit(teamId, taskId, task, team, publicUrl, file.type, file.name);
  } catch(e) {
    console.error(e);
    notify('Upload failed — try again');
  } finally {
    if(prog) prog.classList.remove('show');
    if(lbl) lbl.style.opacity = '1';
    input.value = '';
  }
}

async function doSubmit(teamId, taskId, task, team, fileUrl, fileType, fileName) {
  const req = task.req || 1;
  const currentCounts = team.task_counts || {};
  const newCount = (currentCounts[taskId] || 0) + 1;
  const updatedCounts = { ...currentCounts, [taskId]: newCount };

  const pointsToAward = (newCount % req === 0) ? task.pts : 0;
  const newPts = Math.round((team.pts + pointsToAward) * 10) / 10;
  const subTime = new Date().toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });

  // Update team points and task counts atomically in Supabase
  const { error: teamError } = await sb.from('teams').update({
    pts: newPts,
    task_counts: updatedCounts
  }).eq('id', teamId);

  if(teamError) { notify('Score update failed — try again'); return; }

  // Write submission to Supabase
  await sb.from('submissions').insert({
    team_id: teamId,
    task_id: taskId,
    team_name: team.name,
    task_name: task.name,
    pts_awarded: pointsToAward,
    file_url: fileUrl,
    file_type: fileType,
    file_name: fileName,
    time: subTime,
    count: newCount,
    req: req,
    rep: task.rep
  });

  // Log it
  if(pointsToAward > 0) {
    await sb.from('logs').insert({ time: subTime, msg: `SCORE: ${team.name} completed ${task.name} (+${pointsToAward})` });
    notify(`✓ ${task.name} — +${pointsToAward} pts!`);
  } else {
    notify(`✓ Proof ${newCount % req === 0 ? req : newCount % req}/${req} uploaded!`);
  }

  // Update local state immediately for responsiveness
  const teamIdx = teams.findIndex(t => t.id === teamId);
  if(teamIdx !== -1) {
    teams[teamIdx].pts = newPts;
    teams[teamIdx].task_counts = updatedCounts;
  }
  renderPV();
}

// ── LEADERBOARD ──
function renderLB() {
  const content = document.getElementById('lb-content');
  const sub = document.getElementById('lb-sub');
  if(!content) return;

  if(isBlackout()) {
    sub.textContent = 'LEADERBOARD LOCKED';
    content.innerHTML = `
      <div class="lb-blackout">
        <div class="lb-lock-icon">🔒</div>
        <div class="lb-lock-title">BLACKED OUT</div>
        <div class="lb-lock-sub">Hidden for the final ${settings.bo_hrs || 2} hour${(settings.bo_hrs || 2) > 1 ? 's' : ''}.<br><br>Check back at the reveal.</div>
      </div>`;
    return;
  }

  sub.textContent = 'ISLE OF WIGHT — 2026';
  const sorted = [...teams].sort((a, b) => b.pts - a.pts);
  const pc = ['p1','p2','p3'];
  content.innerHTML = `<div class="lb-list">${sorted.map((t, i) => `
    <div class="lb-row ${pc[i] || ''}">
      <div class="lb-pos">${i + 1}</div>
      <div class="lb-info">
        <div class="lb-name">${t.name}</div>
        <div class="lb-tasks">${totalSubmissions(t)} proof${totalSubmissions(t) !== 1 ? 's' : ''}</div>
      </div>
      ${t.tagged ? '<div class="tagged-pill">TAGGED</div>' : ''}
      <div class="lb-score">${t.pts}</div>
    </div>`).join('')}
  </div>`;
}

// ── REVEAL ──
function triggerRevealUI() {
  const ov = document.getElementById('rev-ov');
  if(ov.classList.contains('on')) return;
  ov.classList.add('on');
  let c = 3;
  const ne = document.getElementById('rev-num');
  const se = document.getElementById('rev-sub');
  const iv = setInterval(() => {
    c--;
    if(c <= 0) { clearInterval(iv); ov.classList.remove('on'); go('leaderboard'); }
    else { ne.textContent = c; se.textContent = c === 2 ? 'WHO WON?' : 'HERE WE GO...'; }
  }, 1000);
}

// ── NOTIFY ──
function notify(msg) {
  const el = document.getElementById('notif');
  el.textContent = msg; el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 2400);
}

init();
</script>
